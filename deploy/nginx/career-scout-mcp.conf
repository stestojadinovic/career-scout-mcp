# nginx vhost for career-scout-mcp.stojadinovic.at
#
# Static documentation served behind Cloudflare Tunnel.
# TLS terminated at Cloudflare edge; this server speaks plain HTTP
# on the loopback interface that cloudflared proxies into.
#
# Install: copy to /etc/nginx/sites-available/career-scout-mcp,
#          ln -s into sites-enabled, then nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name career-scout-mcp.stojadinovic.at;

    root /var/www/career-scout-mcp;
    index index.html;

    # Security headers — CF edge adds HSTS; these cover the origin
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP — strict; only same-origin assets. The small inline <script>
    # in <head> that applies the stored theme is hashed; update the
    # sha256 below if you change that script.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'sha256-INLINE-THEME-SCRIPT-HASH'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Long immutable cache on assets (versioned via content hash if needed)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Deny dotfile access
    location ~ /\. {
        deny all;
        return 404;
    }

    # Hide nginx version from headers
    server_tokens off;
}
