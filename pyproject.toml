[project]
name = "career-scout-mcp"
version = "0.1.0"
description = "Production-grade MCP server demonstrating LLM-based job posting scoring with provider abstraction, strict input validation, and minimal trust surface."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Async SQLite driver for non-blocking storage queries
    "aiosqlite>=0.22.1,<0.23.0",
    # Async HTTP client used by litellm provider transports
    "httpx>=0.28.1,<0.29.0",
    # Provider-agnostic LLM routing (Ollama/Anthropic/OpenAI/DeepSeek)
    "litellm>=1.85.0,<2.0.0",
    # Structured logging with sane defaults
    "loguru>=0.7.3,<0.8.0",
    # Model Context Protocol Python SDK
    "mcp>=1.27.1,<2.0.0",
    # Schema validation and parsing for tool inputs and config
    "pydantic>=2.13.4,<3.0.0",
    # Environment-variable-driven settings layer over pydantic
    "pydantic-settings>=2.14.1,<3.0.0",
    ]

[project.optional-dependencies]
http = [
    # ASGI server for HTTP transport mode (stdio default needs no server)
    "uvicorn>=0.47.0,<0.48.0",
]

[project.scripts]
career-scout-mcp = "career_scout_mcp.__main__:main"

[build-system]
requires = [
    # uv-native PEP 517 build backend
    "uv_build>=0.11.14,<0.12.0",
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Static type checking
    "mypy>=2.1.0,<3.0.0",
    # CVE auditing of locked dependencies
    "pip-audit>=2.10.0,<3.0.0",
    # Git hook orchestration for lint/format/audit on commit
    "pre-commit>=4.6.0,<5.0.0",
    # Test runner
    "pytest>=9.0.3,<10.0.0",
    # Asyncio test support for pytest
    "pytest-asyncio>=1.3.0,<2.0.0",
    # Coverage reporting for pytest
    "pytest-cov>=7.1.0,<8.0.0",
    # Fast Python linter and formatter
    "ruff>=0.15.13,<0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "subprocess: tests that spawn subprocesses for env-import isolation",
]

[tool.coverage.run]
source = ["career_scout_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 85
